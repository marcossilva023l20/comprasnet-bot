# ---------------------------------------------------------------------------
# Arena -> main: verificação e publicação automática (sem PR)
# ---------------------------------------------------------------------------
#
# O que este workflow faz
#   1. Em cada push numa branch `arena/**`, roda lint, typecheck, testes e build.
#   2. Se tudo passar, publica AQUELA MESMA REVISÃO em `main` por fast-forward
#      (nenhum commit novo, nenhum force-push, nada sobrescrito).
#   3. O push em `main` dispara o deploy de produção pela integração Git da
#      Vercel. Nenhum token da Vercel é necessário aqui.
#
# Garantias de segurança
#   - Nenhuma credencial do banco é lida ou passada ao CI. No build, as URLs do
#     banco são explicitamente vazias e SKIP_DB_MIGRATIONS=1 impede qualquer
#     migração. As migrações continuam sendo aplicadas apenas no build da Vercel.
#   - `GITHUB_TOKEN` com permissões mínimas: `contents: read` no CI e
#     `contents: write` somente no job de publicação (nenhum outro escopo).
#   - Nunca faz force-push nem reescreve `main`. O push é rejeitado pelo próprio
#     Git se não for fast-forward — a checagem explícita existe só para explicar
#     o motivo com clareza e parar sem publicar.
#   - Publicações são serializadas (uma de cada vez); nenhuma é cancelada no
#     meio.
#   - Nenhum token, senha ou credencial vive neste arquivo. O único secret
#     opcional (VERCEL_DEPLOY_HOOK) é cadastrado pelo dono do repositório no
#     GitHub e injetado somente na etapa que dispara esse hook.
#
# Observação sobre `.github/workflows/**`
#   O GitHub recusa push do `GITHUB_TOKEN` quando o commit é CRIADO DENTRO do
#   próprio workflow e altera arquivos de workflow (regra "workflows
#   permission", que nenhum bloco `permissions:` concede). Aqui isso não ocorre:
#   os commits já existem no servidor (foram enviados para a branch da sessão
#   antes) e o job apenas faz fast-forward de `main` para eles — o push é aceito.
#
# Configuração necessária no GitHub: veja a seção
# "Deploy automático (Arena -> main -> Vercel)" no README.md.

name: Arena → main (CI + publicação)

on:
  push:
    branches:
      - "arena/**"
  # Reexecução manual (por exemplo, depois de um ajuste de permissões).
  # O job de publicação só roda quando a ref é uma branch `arena/**`.
  workflow_dispatch:

# Permissão mínima para tudo o que não pedir mais explicitamente.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # 1) Verificações
  # -------------------------------------------------------------------------
  verificacoes:
    name: Verificações (lint, typecheck, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (sem guardar credenciais no .git/config)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Os pacotes históricos são reconstruídos de revisões imutáveis.
          fetch-depth: 0

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Testes da extensão (harnesses)
        run: npm run teste:extensao

      - name: Build (sem banco de dados e sem migrações)
        env:
          # Nunca injeta secrets do banco. As URLs vazias protegem o build mesmo
          # se variáveis forem adicionadas ao runner por outra configuração.
          DATABASE_URL: ""
          POSTGRES_URL: ""
          POSTGRES_PRISMA_URL: ""
          SKIP_DB_MIGRATIONS: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Resumo das verificações
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          REVISAO: ${{ github.sha }}
        run: |
          {
            echo "### Verificações"
            echo ""
            echo "| etapa | branch | revisão |"
            echo "| --- | --- | --- |"
            echo "| lint, typecheck, testes e harnesses, build | \`${BRANCH}\` | \`${REVISAO}\` |"
            echo ""
            echo "Sem credenciais do banco: URLs vazias e \`SKIP_DB_MIGRATIONS=1\`; nenhuma migração no CI."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # 2) Publicação em main + deploy de produção na Vercel
  # -------------------------------------------------------------------------
  publicar:
    name: Publicar em main (fast-forward) → Vercel
    needs: verificacoes
    # Só publica revisões de branches da Arena (nunca a própria main).
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'arena/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Único escopo de escrita do workflow, e só neste job.
    permissions:
      contents: write
    # Serializa as publicações e preserva até 100 execuções pendentes em FIFO.
    concurrency:
      group: publicar-main
      queue: max
    steps:
      - name: Checkout da revisão validada
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Conferir divergência e decidir se publica
        id: revisao
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          REVISAO="$(git rev-parse HEAD)"
          MAIN_ANTES="$(git rev-parse origin/main)"
          PUBLICAR="false"

          {
            echo "revisao=$REVISAO"
            echo "main_antes=$MAIN_ANTES"
          } >> "$GITHUB_OUTPUT"

          if [ "$REVISAO" = "$MAIN_ANTES" ]; then
            echo "main já está exatamente nesta revisão — nada a publicar."
          elif git merge-base --is-ancestor origin/main "$REVISAO"; then
            PUBLICAR="true"
            echo "Publicação segura: origin/main é ancestral de $REVISAO (fast-forward)."
          elif git merge-base --is-ancestor "$REVISAO" origin/main; then
            echo "Esta revisão já está contida em main — nada a publicar."
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Publicação abortada: main divergiu"
              echo ""
              echo "Nada foi publicado e nada foi sobrescrito."
              echo ""
              echo "- revisão da branch: \`$REVISAO\`"
              echo "- main (origin): \`$MAIN_ANTES\`"
              echo ""
              echo "Como resolver: atualize a branch da sessão a partir de \`main\` (merge/rebase),"
              echo "rode as verificações de novo e faça um novo push em \`arena/**\`."
              echo "Históricos com conflito exigem decisão humana — este workflow não resolve conflitos."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=main divergiu::main não é ancestral desta revisão e esta revisão não está contida em main. Publicação interrompida sem force-push e sem sobrescrever nada."
            exit 1
          fi

          # Aviso (não bloqueia): revisões que alteram workflows são aceitas aqui
          # porque os commits já existem no servidor; o GitHub só recusa commits
          # criados dentro do próprio workflow que tocam `.github/workflows/**`.
          if [ "$PUBLICAR" = "true" ] && ! git diff --quiet "origin/main...$REVISAO" -- .github/workflows; then
            echo "::notice title=Revisão altera workflow::Esta revisão muda arquivos em .github/workflows/. Isso é publicável porque os commits vieram da branch da sessão (já existem no servidor). Se o push for recusado algum dia, veja a seção de problemas no README.md."
          fi

          echo "publicar=$PUBLICAR" >> "$GITHUB_OUTPUT"

      - name: Publicar em main (fast-forward, sem force)
        id: push
        if: steps.revisao.outputs.publicar == 'true'
        run: |
          set -euo pipefail

          REVISAO_ATUAL="$(git rev-parse HEAD)"

          if ! git push origin HEAD:main > /tmp/push.out 2> /tmp/push.err; then
            echo "publicado=false" >> "$GITHUB_OUTPUT"
            ERRO="$( { cat /tmp/push.err /tmp/push.out 2>/dev/null || true; } | tail -4 | tr '\n' '|' | cut -c1-500)"
            echo "::group::Saída do git push"
            cat /tmp/push.err 2>/dev/null || true
            cat /tmp/push.out 2>/dev/null || true
            echo "::endgroup::"
            {
              echo "### Publicação falhou (nada foi publicado)"
              echo ""
              echo "O \`git push\` foi rejeitado:"
              echo ""
              echo '```'
              echo "$ERRO" | tr '|' '\n'
              echo '```'
              echo ""
              echo "Motivos mais comuns:"
              echo ""
              echo "1. **Permissão**: em GitHub → Settings → Actions → General → Workflow permissions,"
              echo "   deixe marcado *Read and write permissions*."
              echo "2. **Proteção de branch em \`main\`**: se houver regra de proteção/ruleset, adicione"
              echo "   *GitHub Actions* à lista de exceções (bypass) e não exija pull request."
              echo "3. **Arquivos de workflow**: o GitHub recusa commits criados dentro do próprio workflow"
              echo "   que alteram \`.github/workflows/**\` (regra 'workflows permission'). Neste projeto os"
              echo "   commits já existem no servidor, então isso normalmente não se aplica."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Publicação não autorizada::git push rejeitado: ${ERRO}"
            exit 1
          fi

          # Confirma o estado real do remoto (e não apenas a intenção do push).
          git fetch --no-tags origin main
          MAIN_DEPOIS="$(git rev-parse origin/main)"
          echo "main_depois=$MAIN_DEPOIS" >> "$GITHUB_OUTPUT"
          echo "publicado=true" >> "$GITHUB_OUTPUT"

          if [ "$MAIN_DEPOIS" != "$REVISAO_ATUAL" ]; then
            echo "::error title=Estado inesperado::origin/main ($MAIN_DEPOIS) não é a revisão publicada ($REVISAO_ATUAL). Verifique manualmente antes de qualquer nova publicação."
            exit 1
          fi

          echo "Publicado: main agora aponta para $MAIN_DEPOIS"

      # Opcional: sem este secret, o push em main já dispara o deploy de produção
      # pela integração Git da Vercel. Com ele, garantimos o disparo também nos
      # casos em que a Vercel recusa commits automáticos.
      - name: Disparar deploy de produção na Vercel (opcional)
        id: vercel
        if: steps.push.outputs.publicado == 'true'
        env:
          # O hook é opcional e fica acessível apenas nesta etapa.
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_DEPLOY_HOOK:-}" ]; then
            echo "modo=integração Git da Vercel (push em main)" >> "$GITHUB_OUTPUT"
            echo "Sem Deploy Hook configurado; a integração Git da Vercel recebe o push em main."
            exit 0
          fi

          echo "modo=Deploy Hook explícito" >> "$GITHUB_OUTPUT"
          STATUS="$(curl -sS -o /tmp/vercel-hook.json -w '%{http_code}' -X POST "$VERCEL_DEPLOY_HOOK" || true)"
          echo "Resposta da Vercel (HTTP $STATUS): $(cat /tmp/vercel-hook.json 2>/dev/null || true)"

          if [ -z "$STATUS" ] || [ "$STATUS" -ge 400 ]; then
            echo "::error title=Deploy Hook recusado::A Vercel recusou o Deploy Hook (HTTP ${STATUS:-sem resposta}). Confira o hook em Vercel → Project Settings → Git → Deploy Hooks."
            exit 1
          fi

      - name: Resumo da publicação
        if: always()
        env:
          PUBLICADO: ${{ steps.push.outputs.publicado }}
          BRANCH: ${{ github.ref_name }}
          REVISAO_VALIDADA: ${{ steps.revisao.outputs.revisao }}
          MAIN_ANTES: ${{ steps.revisao.outputs.main_antes }}
          MAIN_DEPOIS: ${{ steps.push.outputs.main_depois }}
          MODO_DEPLOY: ${{ steps.vercel.outputs.modo || 'não executado (nenhum novo push em main)' }}
        run: |
          {
            echo "## Publicação (Arena → main → Vercel)"
            echo ""
            echo "| item | valor |"
            echo "| --- | --- |"
            echo "| branch | \`${BRANCH}\` |"
            echo "| revisão validada | \`${REVISAO_VALIDADA}\` |"
            echo "| main antes | \`${MAIN_ANTES}\` |"
            echo "| publicado em main | \`${MAIN_DEPOIS}\` |"
            echo "| deploy da Vercel | ${MODO_DEPLOY} |"
            echo ""
            if [ "${PUBLICADO}" = "true" ]; then
              echo "Verificação: confira em Vercel → Deployments a implantação de **Production** com o commit \`${MAIN_DEPOIS}\`."
            else
              echo "Nada foi publicado nesta execução. Veja acima o motivo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
